# Real hardware controller configuration
# Empty name means use default controller from remapping in realMove_exec.launch
# This allows the remapping to connect MoveIt to /xarm/xarm6_traj_controller/follow_joint_trajectory
controller_list:
  - name: ""                    # Empty name for hardware - remapping handles actual controller connection
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
  - name: gripper_controller
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    joints:
      - finger_joint

